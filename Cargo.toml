[package]
name = "solana-trading-api"
version = "0.1.1"
edition = "2024"
# never publish to crates.io — this stays private (consumed via private git / path dep)
publish = false
autotests = false

[[test]]
name = "swap_simulation"
path = "tests/simulation/swaps.rs"

[[test]]
name = "live_buy"
path = "tests/live/buy_sell.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
# Jupiter aggregator + submitters (bloXroute): http client + json + base64 + tx wire bytes
base64 = "0.22"
bincode = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# borsh + derive: account layouts are read into named-field structs (not byte offsets)
borsh = { version = "1.6.1", features = ["derive"] }
# granular solana crates pinned to solana-client 4.0's line (no solana-sdk meta-crate,
# which is ahead of the client and caused a VersionedTransaction type skew)
solana-client = "4.0.0"
solana-pubkey = { version = "4.1.0", features = ["borsh"] }
solana-instruction = "3.3.0"
solana-message = "3.1.0"
solana-transaction = { version = "3.1.0", features = ["bincode"] }
solana-signature = "3.3.0"
solana-commitment-config = "3.1.0"
solana-address-lookup-table-interface = { version = "3.0.1", features = ["bincode", "bytemuck"] }
# sha256 for deriving Anchor instruction discriminators from method names
sha2 = "0.10"
spl-token = "9.0.0"
# typed library error (TradeError) so the API-layer consumer gets legible failures
thiserror = "2"
tokio = "1.52.3"

[dev-dependencies]
serde_json = "1"
# local keypair signing for the live execute_swap test (NOT a runtime dep — Turnkey
# is the real signer; this is only to exercise the executor end-to-end)
solana-keypair = "3.0.0"
solana-signer = "3.0.0"
solana-slot-hashes = { version = "3.0.1", features = ["serde"] }
